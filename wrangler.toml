
name = "alon-historyverse-marketplace-api"
main = "marketplace-api-worker.js"
compatibility_date = "2026-09-23"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "alon-historyverse-marketplace-db"
database_id = "1d06958e-f352-4357-97c5-598e8168946b"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.traces.spans]
enabled = true
