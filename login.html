<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — ALON HISTORYVERSE 24</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="page-shell"><section class="hero"><h1>Login</h1><p>Local project login screen. Firebase authentication can be enabled in the project configuration.</p></section><section class="content-card"><form id="login-form"><label>Email<input id="login-email" type="email" required></label><label>Password<input id="login-password" type="password" required></label><button class="primary-button" type="submit">Sign in</button></form><p id="login-status" role="status"></p></section></main><script src="../jss/firebase.js"></script><script src="../jss/master-controller.js"></script><script>document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('login-status').textContent='Authentication is ready for Firebase configuration.';});</script></body></html>
