<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Jobs & Careers • ALON HISTORYVERSE 24</title>

<meta
    name="description"
    content="ALON HISTORYVERSE 24 Jobs & Careers — International and Local Jobs"

<link rel="stylesheet" href="./style.css">

<style>

/* =========================================================
   ALON HISTORYVERSE 24
   JOBS & CAREERS
   Version: 24.3 SAFE JOBS
   Creator: Baba Thecno Guru
   ========================================================= */

:root{
    --jobs-blue:#1976d2;
    --jobs-blue-dark:#0d47a1;
    --jobs-bg:#f5f7fa;
    --jobs-card:#ffffff;
    --jobs-border:#d9dee5;
    --jobs-text:#17202a;
    --jobs-muted:#667085;
    --jobs-danger:#c62828;
    --jobs-success:#16803c;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--jobs-bg);
    color:var(--jobs-text);
}

.jobs-page{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:20px 14px 50px;
}

.jobs-title-box{
    background:#fff;
    border:1px solid var(--jobs-border);
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    text-align:center;
}

.jobs-title-box h1{
    margin:0 0 8px;
    font-size:28px;
}

.jobs-title-box p{
    margin:0;
    color:var(--jobs-muted);
}

.jobs-tabs{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:18px;
}

.jobs-tab{
    border:1px solid var(--jobs-border);
    background:#fff;
    border-radius:12px;
    padding:13px 10px;
    font-weight:700;
    cursor:pointer;
}

.jobs-tab.active{
    background:var(--jobs-blue);
    color:#fff;8
    border-color:var(--jobs-blue);
}

.jobs-panel{
    display:none;
}

.jobs-panel.active{
    display:block;
}

.jobs-card{
    background:var(--jobs-card);
    border:1px solid var(--jobs-border);
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.jobs-card h2{
    margin:0 0 15px;
    font-size:21px;
}

.jobs-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}

.jobs-field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.jobs-field.full{
    grid-column:1/-1;
}

.jobs-field label{
    font-size:14px;
    font-weight:700;
}

.jobs-field input,
.jobs-field select,
.jobs-field textarea{
    width:100%;
    border:1px solid #cbd2d9;
    border-radius:9px;
    padding:11px 12px;
    background:#fff;
    color:#111;
    font-size:15px;
    outline:none;
}

.jobs-field input:focus,
.jobs-field select:focus,
.jobs-field textarea:focus{
    border-color:var(--jobs-blue);
}

.jobs-field textarea{
    min-height:120px;
    resize:vertical;
}

.jobs-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
}

.jobs-btn{
    border:0;
    border-radius:9px;
    padding:11px 17px;
    font-weight:700;
    cursor:pointer;
    background:var(--jobs-blue);
    color:#fff;
}

.jobs-btn:hover{
    background:var(--jobs-blue-dark);
}

.jobs-btn.secondary{
    background:#6b7280;
}

.jobs-btn.danger{
    background:var(--jobs-danger);
}

.jobs-btn.success{
    background:var(--jobs-success);
}

.jobs-login-status{
    border-radius:10px;
    padding:12px;
    background:#eef6ff;
    border:1px solid #b9dcff;
    margin-bottom:15px;
}

.jobs-profile{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.jobs-profile.active{
    display:flex;
}

.jobs-profile-email{
    font-weight:700;
    word-break:break-word;
}

.jobs-login-form.hidden{
    display:none;
}

.jobs-agreement{
    display:flex;
    gap:9px;
    align-items:flex-start;
    margin-top:12px;
    font-size:14px;
}

.jobs-agreement input{
    width:18px;
    height:18px;
    margin-top:1px;
}

.jobs-message{
    display:none;
    padding:11px 13px;
    border-radius:9px;
    margin-top:12px;
    font-weight:600;
}

.jobs-message.show{
    display:block;
}

.jobs-message.error{
    background:#ffebee;
    color:#b71c1c;
    border:1px solid #ffcdd2;
}

.jobs-message.success{
    background:#e8f5e9;
    color:#1b5e20;
    border:1px solid #c8e6c9;
}

.jobs-list{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:15px;
}

.job-item{
    background:#fff;
    border:1px solid var(--jobs-border);
    border-radius:14px;
    overflow:hidden;
}

.job-item-body{
    padding:15px;
}

.job-item h3{
    margin:0 0 8px;
    font-size:19px;
}

.job-meta{
    display:grid;
    gap:5px;
    margin:10px 0;
    color:#344054;
    font-size:14px;
}

.job-description{
    white-space:pre-wrap;
    line-height:1.5;
    color:#475467;
}

.job-media{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
    padding:8px;
}

.job-media img,
.job-media video{
    width:100%;
    max-height:230px;
    object-fit:cover;
    border-radius:8px;
    background:#eee;
}

.job-owner{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:4px 8px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.empty-jobs{
    padding:25px;
    text-align:center;
    color:var(--jobs-muted);
    background:#fff;
    border:1px dashed #cbd2d9;
    border-radius:12px;
    grid-column:1/-1;
}

.country-option{
    font-size:15px;
}

@media(max-width:700px){

    .jobs-page{
        padding:12px 9px 35px;
    }

    .jobs-title-box h1{
        font-size:23px;
    }

    .jobs-grid,
    .jobs-list{
        grid-template-columns:1fr;
    }

    .jobs-field.full{
        grid-column:auto;
    }

    .jobs-tabs{
        grid-template-columns:1fr;
    }

    .jobs-btn{
        width:100%;
    }

    .jobs-profile{
        align-items:stretch;
    }

}

</style>

<script>

/* =========================================================
   ALON HISTORYVERSE 24
   JOBS ENGINE
   Version: 24.3 SAFE JOBS
   ========================================================= */

(function(){

"use strict";


/* =========================================================
   STORAGE
   ========================================================= */

const JOBS_KEY = "alon_historyverse_jobs_v243";
const JOBS_ACCOUNT_KEY = "alon_historyverse_jobs_account_v243";
const JOBS_SESSION_KEY = "alon_historyverse_jobs_session_v243";


/* =========================================================
   STATE
   ========================================================= */

let jobs = [];
let editingInternationalId = "";
let editingLocalId = "";


/* =========================================================
   HELPERS
   ========================================================= */

function byId(id){
    return document.getElementById(id);
}


function safeParse(value, fallback){

    try{
        const parsed = JSON.parse(value);

        return parsed === null || parsed === undefined
            ? fallback
            : parsed;

    }catch(error){
        return fallback;
    }

}


function makeId(){

    return "job_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2,10);

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function showMessage(text,type){

    const box = byId("jobsMessage");

    if(!box){
        return;
    }

    box.textContent = text;
    box.className = "jobs-message show " +
        (type === "error" ? "error" : "success");

    window.setTimeout(function(){

        box.className = "jobs-message";

    },4000);

}


/* =========================================================
   ACCOUNT
   ========================================================= */

function getAccount(){

    return safeParse(
        localStorage.getItem(JOBS_ACCOUNT_KEY),
        null
    );

}


function getSession(){

    return safeParse(
        localStorage.getItem(JOBS_SESSION_KEY),
        null
    );

}


function isLoggedIn(){

    const session = getSession();
    const account = getAccount();

    return !!(
        session &&
        account &&
        session.email &&
        account.email &&
        session.email === account.email
    );

}


function updateLoginUI(){

    const form = byId("jobsLoginForm");
    const profile = byId("jobsProfile");
    const emailBox = byId("jobsProfileEmail");
    const status = byId("jobsLoginStatus");

    if(isLoggedIn()){

        const account = getAccount();

        if(form){
            form.classList.add("hidden");
        }

        if(profile){
            profile.classList.add("active");
        }

        if(emailBox){
            emailBox.textContent = account.email;
        }

        if(status){
            status.textContent =
                "You are logged in. You can save, edit and delete your own jobs.";
        }

    }else{

        if(form){
            form.classList.remove("hidden");
        }

        if(profile){
            profile.classList.remove("active");
        }

        if(emailBox){
            emailBox.textContent = "";
        }

        if(status){
            status.textContent =
                "Please login to save, edit or delete your jobs.";
        }

    }

}


/* =========================================================
   LOGIN
   ========================================================= */

function loginUser(event){

    event.preventDefault();

    const email =
        byId("jobsLoginEmail").value.trim().toLowerCase();

    const password =
        byId("jobsLoginPassword").value;

    const agreement =
        byId("jobsAgreement").checked;

    if(!agreement){

        showMessage(
            "Please accept the Jobs & Careers agreement before login.",
            "error"
        );

        return;
    }

    if(!email || !password){

        showMessage(
            "Please enter email and password.",
            "error"
        );

        return;
    }

    const oldAccount = getAccount();

    if(oldAccount){

        if(
            oldAccount.email !== email ||
            oldAccount.password !== password
        ){

            showMessage(
                "Email or password is incorrect.",
                "error"
            );

            return;
        }

    }else{

        localStorage.setItem(
            JOBS_ACCOUNT_KEY,
            JSON.stringify({
                email:email,
                password:password,
                createdAt:new Date().toISOString()
            })
        );

    }

    localStorage.setItem(
        JOBS_SESSION_KEY,
        JSON.stringify({
            email:email,
            loginAt:new Date().toISOString()
        })
    );

    updateLoginUI();

    byId("jobsLoginPassword").value = "";

    showMessage(
        "Login successful.",
        "success"
    );

    renderAll();

}


function logoutUser(){

    localStorage.removeItem(JOBS_SESSION_KEY);

    editingInternationalId = "";
    editingLocalId = "";

    resetInternationalForm();
    resetLocalForm();

    updateLoginUI();
    renderAll();

    showMessage(
        "You have been logged out.",
        "success"
    );

}


/* =========================================================
   COUNTRY DATABASE
   ========================================================= */

function getCountryDatabase(){

    const possibleNames = [
        "MARKETPLACE_COUNTRIES",
        "ALON_WORLD_COUNTRIES",
        "WORLD_COUNTRIES"
    ];

    for(const name of possibleNames){

        try{

            if(
                typeof window[name] !== "undefined" &&
                Array.isArray(window[name])
            ){

                return window[name];

            }

        }catch(error){}

    }

    return [];

}


function normalizeCountry(item){

    if(typeof item === "string"){

        return {
            name:item,
            iso:"",
            code:"",
            flag:"🌐"
        };

    }

    if(!item || typeof item !== "object"){
        return null;
    }

    const name =
        item.name ||
        item.country ||
        item.countryName ||
        item.label ||
        "";

    if(!name){
        return null;
    }

    const iso =
        item.iso ||
        item.iso2 ||
        item.ISO ||
        item.code2 ||
        item.alpha2 ||
        item.countryCode ||
        "";

    const calling =
        item.callingCode ||
        item.calling ||
        item.dialCode ||
        item.phoneCode ||
        item.phone ||
        "";

    const flag =
        item.flag ||
        item.emoji ||
        item.countryFlag ||
        "🌐";

    return {
        name:String(name),
        iso:String(iso || ""),
        code:String(calling || ""),
        flag:String(flag || "🌐")
    };

}


function getCountries(){

    const raw = getCountryDatabase();

    const result = [];

    raw.forEach(function(item){

        const country = normalizeCountry(item);

        if(country){
            result.push(country);
        }

    });

    result.sort(function(a,b){

        return a.name.localeCompare(
            b.name,
            undefined,
            {sensitivity:"base"}
        );

    });

    return result;

}


function fillCountrySelect(selectId){

    const select = byId(selectId);

    if(!select){
        return;
    }

    const current = select.value;

    select.innerHTML =
        '<option value="">Select Country</option>';

    const countries = getCountries();

    countries.forEach(function(country){

        const option =
            document.createElement("option");

        option.value = JSON.stringify(country);

        option.className = "country-option";

        option.textContent =
            country.flag +
            " " +
            country.name +
            (country.iso
                ? " (" + country.iso.toUpperCase() + ")"
                : "") +
            (country.code
                ? " " + country.code
                : "");

        select.appendChild(option);

    });

    if(current){

        for(const option of select.options){

            if(option.value === current){

                select.value = current;
                break;

            }

        }

    }

}


function readCountry(selectId){

    const select = byId(selectId);

    if(!select || !select.value){
        return null;
    }

    return safeParse(
        select.value,
        null
    );

}


/* =========================================================
   MEDIA
   ========================================================= */

function fileToDataURL(file){

    return new Promise(function(resolve,reject){

        if(!file){
            resolve("");
            return;
        }

        const reader = new FileReader();

        reader.onload = function(){
            resolve(reader.result);
        };

        reader.onerror = function(){
            reject(reader.error);
        };

        reader.readAsDataURL(file);

    });

}


async function getMedia(imageId,videoId,oldJob){

    let image = oldJob ? oldJob.image || "" : "";
    let video = oldJob ? oldJob.video || "" : "";

    const imageInput = byId(imageId);
    const videoInput = byId(videoId);

    if(
        imageInput &&
        imageInput.files &&
        imageInput.files[0]
    ){

        image =
            await fileToDataURL(imageInput.files[0]);

    }

    if(
        videoInput &&
        videoInput.files &&
        videoInput.files[0]
    ){

        video =
            await fileToDataURL(videoInput.files[0]);

    }

    return {
        image:image,
        video:video
    };

}


/* =========================================================
   LOAD / SAVE JOBS
   ========================================================= */

function loadJobs(){

    jobs = safeParse(
        localStorage.getItem(JOBS_KEY),
        []
    );

    if(!Array.isArray(jobs)){
        jobs = [];
    }

}


function saveJobs(){

    localStorage.setItem(
        JOBS_KEY,
        JSON.stringify(jobs)
    );

}


/* =========================================================
   GET FORM DATA
   ========================================================= */

function getCommonData(type){

    const international = type === "international";

    const prefix =
        international
            ? "international"
            : "local";

    const country =
        readCountry(prefix + "Country");

    return {

        id:makeId(),

        type:type,

        owner:getAccount().email,

        country:country,

        category:
            byId(prefix + "Category").value.trim(),

        title:
            byId(prefix + "Title").value.trim(),

        salary:
            byId(prefix + "Salary").value.trim(),

        appointment:
            byId(prefix + "Appointment").value.trim(),

        location:
            byId(prefix + "Location").value.trim(),

        description:
            byId(prefix + "Description").value.trim(),

        createdAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString()

    };

}


/* =========================================================
   SAVE INTERNATIONAL JOB
   ========================================================= */

async function saveInternationalJob(event){

    event.preventDefault();

    if(!isLoggedIn()){

        showMessage(
            "Please login before saving a job.",
            "error"
        );

        return;
    }

    const country =
        readCountry("internationalCountry");

    if(!country){

        showMessage(
            "Please select a country.",
            "error"
        );

        return;
    }

    const editId = editingInternationalId;

    const oldJob =
        jobs.find(function(job){
            return job.id === editId;
        }) || null;

    const media =
        await getMedia(
            "internationalImage",
            "internationalVideo",
            oldJob
        );

    const newJob =
        getCommonData("international");

    newJob.image = media.image;
    newJob.video = media.video;

    if(oldJob){

        newJob.id = oldJob.id;
        newJob.owner = oldJob.owner;
        newJob.createdAt = oldJob.createdAt;

        const index =
            jobs.findIndex(function(job){
                return job.id === oldJob.id;
            });

        if(index !== -1){
            jobs[index] = newJob;
        }

        showMessage(
            "International job updated successfully.",
            "success"
        );

    }else{

        jobs.unshift(newJob);

        showMessage(
            "International job saved successfully.",
            "success"
        );

    }

    saveJobs();

    resetInternationalForm();

    renderAll();

}

/* =========================================================
   DELETE
   ========================================================= */

function deleteJob(id){

    if(!isLoggedIn()){

        showMessage(
            "Please login first.",
            "error"
        );

        return;
    }

    const job =
        jobs.find(function(item){
            return item.id === id;
        });

    if(!job){
        return;
    }

    if(job.owner !== getAccount().email){

        showMessage(
            "You can delete only your own jobs.",
            "error"
        );

        return;
    }

    const confirmed =
        window.confirm(
            "Delete this job permanently?"
        );

    if(!confirmed){
        return;
    }

    jobs =
        jobs.filter(function(item){
            return item.id !== id;
        });

    saveJobs();

    renderAll();

    showMessage(
        "Job deleted successfully.",
        "success"
    );

}


/* =========================================================
   EDIT
   ========================================================= */

function editJob(id){

    if(!isLoggedIn()){

        showMessage(
            "Please login first.",
            "error"
        );

        return;
    }

    const job =
        jobs.find(function(item){
            return item.id === id;
        });

    if(!job){
        return;
    }

    if(job.owner !== getAccount().email){

        showMessage(
            "You can edit only your own jobs.",
            "error"
        );

        return;
    }

    const prefix =
        job.type === "international"
            ? "international"
            : "local";

    const panel =
        job.type === "international"
            ? "internationalPanel"
            : "localPanel";

    const countrySelect =
        byId(prefix + "Country");

    if(countrySelect){

        const country = job.country;

        for(const option of countrySelect.options){

            const value =
                safeParse(option.value,null);

            if(
                value &&
                country &&
                value.name === country.name
            ){

                countrySelect.value =
                    option.value;

                break;

            }

        }

    }

    byId(prefix + "Category").value =
        job.category || "";

    byId(prefix + "Title").value =
        job.title || "";

    byId(prefix + "Salary").value =
        job.salary || "";

    byId(prefix + "Appointment").value =
        job.appointment || "";

    byId(prefix + "Location").value =
        job.location || "";

    byId(prefix + "Description").value =
        job.description || "";

    if(job.type === "international"){

        editingInternationalId = job.id;

        byId("internationalCancelEdit").style.display =
            "inline-block";

    }else{

        editingLocalId = job.id;

        byId("localCancelEdit").style.display =
            "inline-block";

    }

    document.querySelectorAll(".jobs-tab").forEach(function(tab){

        tab.classList.toggle(
            "active",
            tab.dataset.jobTab === job.type
        );

    });

    document.querySelectorAll(".jobs-panel").forEach(function(panelEl){

        panelEl.classList.toggle(
            "active",
            panelEl.id === panel
        );

    });

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* =========================================================
   MEDIA HTML
   ========================================================= */

function renderMedia(job){

    let html = "";

    if(job.image){

        html +=
            '<img src="' +
            job.image +
            '" alt="Job image">';

    }

    if(job.video){

        html +=
            '<video controls preload="metadata">' +
            '<source src="' +
            job.video +
            '">' +
            'Your browser does not support video.' +
            '</video>';

    }

    if(!html){
        return "";
    }

    return '<div class="job-media">' +
        html +
        '</div>';

}


/* =========================================================
   JOB CARD
   ========================================================= */

function renderJobCard(job){

    const currentUser =
        isLoggedIn()
            ? getAccount().email
            : "";

    const isOwner =
        !!currentUser &&
        job.owner === currentUser;

    const country =
        job.country || {};

    const countryText =
        (country.flag || "🌐") +
        " " +
        (country.name || "Unknown Country") +
        (country.iso
            ? " (" + country.iso.toUpperCase() + ")"
            : "") +
        (country.code
            ? " " + country.code
            : "");

    let actions = "";

    if(isOwner){

        actions =
            '<div class="jobs-actions">' +

            '<button ' +
            'type="button" ' +
            'class="jobs-btn" ' +
            'data-edit-job="' +
            escapeHTML(job.id) +
            '">' +
            'Edit' +
            '</button>' +

            '<button ' +
            'type="button" ' +
            'class="jobs-btn danger" ' +
            'data-delete-job="' +
            escapeHTML(job.id) +
            '">' +
            'Delete' +
            '</button>' +

            '</div>';

    }

    return (

        '<article class="job-item">' +

        renderMedia(job) +

        '<div class="job-item-body">' +

        '<h3>' +
        escapeHTML(job.title) +
        '</h3>' +

        '<div class="job-meta">' +

        '<div><strong>Country:</strong> ' +
        escapeHTML(countryText) +
        '</div>' +

        '<div><strong>Category:</strong> ' +
        escapeHTML(job.category) +
        '</div>' +

        '<div><strong>Salary:</strong> ' +
        escapeHTML(job.salary) +
        '</div>' +

        '<div><strong>Appointment:</strong> ' +
        escapeHTML(job.appointment) +
        '</div>' +

        '<div><strong>Location:</strong> ' +
        escapeHTML(job.location) +
        '</div>' +

        '</div>' +

        '<div class="job-description">' +
        escapeHTML(job.description) +
        '</div>' +

        '<div style="margin-top:12px;">' +

        '<span class="job-owner">' +
        (isOwner ? "Your Job" : "Job Listing") +
        '</span>' +

        '</div>' +

        actions +

        '</div>' +

        '</article>'

    );

}


/* =========================================================
   RENDER LIST
   ========================================================= */

function renderList(type,listId){

    const container =
        byId(listId);

    if(!container){
        return;
    }

    const filtered =
        jobs.filter(function(job){
            return job.type === type;
        });

    if(!filtered.length){

        container.innerHTML =
            '<div class="empty-jobs">' +
            'No jobs available yet.' +
            '</div>';

        return;
    }

    container.innerHTML =
        filtered.map(renderJobCard).join("");

    container
        .querySelectorAll("[data-edit-job]")
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    editJob(
                        button.dataset.editJob
                    );

                }
            );

        });

    container
        .querySelectorAll("[data-delete-job]")
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    deleteJob(
                        button.dataset.deleteJob
                    );

                }
            );

        });

}


function renderAll(){

    renderList(
        "international",
        "internationalJobsList"
    );

    renderList(
        "local",
        "localJobsList"
    );

}


/* =========================================================
   TABS
   ========================================================= */

function setupTabs(){

    document
        .querySelectorAll(".jobs-tab")
        .forEach(function(tab){

            tab.addEventListener(
                "click",
                function(){

                    const target =
                        tab.dataset.jobTab;

                    document
                        .querySelectorAll(".jobs-tab")
                        .forEach(function(item){

                            item.classList.toggle(
                                "active",
                                item === tab
                            );

                        });

                    document
                        .querySelectorAll(".jobs-panel")
                        .forEach(function(panel){

                            panel.classList.toggle(
                                "active",
                                panel.id ===
                                target + "Panel"
                            );

                        });

                }
            );

        });

}


/* =========================================================
   INIT
   ========================================================= */

function init(){

    loadJobs();

    fillCountrySelect(
        "internationalCountry"
    );

    fillCountrySelect(
        "localCountry"
    );

    setupTabs();

    byId("jobsLoginForm")
        .addEventListener(
            "submit",
            loginUser
        );

    byId("jobsLogoutBtn")
        .addEventListener(
            "click",
            logoutUser
        );

    byId("internationalJobForm")
        .addEventListener(
            "submit",
            saveInternationalJob
        );

    byId("localJobForm")
        .addEventListener(
            "submit",
            saveLocalJob
        );

    byId("internationalCancelEdit")
        .addEventListener(
            "click",
            resetInternationalForm
        );

    byId("localCancelEdit")
        .addEventListener(
            "click",
            resetLocalForm
        );

    updateLoginUI();

    renderAll();

}


/* =========================================================
   START
   ========================================================= */

if(
    document.readyState === "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}else{

    init();

}

})();

</script>
